services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: exam-portal-app:latest
    container_name: exam_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
    volumes:
      - .:/var/www/html
      - public_build:/var/www/html/public/build
      - /var/www/html/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - exam-network

  web:
    image: nginx:alpine
    container_name: exam_web
    restart: unless-stopped
    ports:
      - "${FORWARD_APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - public_build:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - exam-network

  db:
    image: mysql:8.0
    container_name: exam_db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-exam}
      MYSQL_USER: ${DB_USERNAME:-exam_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - exam-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: exam_pma
    restart: unless-stopped
    ports:
      - "${FORWARD_PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - exam-network

volumes:
  db_data:
    driver: local
  public_build:
    driver: local

networks:
  exam-network:
    driver: bridge
